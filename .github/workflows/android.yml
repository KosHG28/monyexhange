name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Создать GitHub Release с этим тегом (например, v0.1.0); пусто — просто сборка'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Tests, lint, build
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/dirhamrub-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/dirhamrub-release.apk

      # Квота хранилища артефактов общая на аккаунт; если она кончилась, сборка всё равно зелёная,
      # а APK для установки публикуется через GitHub Release по тегу.
      - uses: actions/upload-artifact@v5
        if: success()
        continue-on-error: true
        with:
          name: dirhamrub-apk
          path: out/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with:
          retention-days: 7
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # Релиз: по пушу тега v* или вручную (workflow_dispatch с release=vX.Y.Z) —
      # во втором случае gh сам создаёт тег на собранном коммите.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release || github.ref_name }}
        run: |
          cp out/dirhamrub-release.apk "out/dirhamrub-$TAG.apk"
          gh release create "$TAG" "out/dirhamrub-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Дирхамы в рубли $TAG" \
            --notes "APK для Android 8.0+. Как установить — см. README." \
            || gh release upload "$TAG" "out/dirhamrub-$TAG.apk" --clobber
