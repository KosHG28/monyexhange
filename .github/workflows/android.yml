name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Создать GitHub Release с этим тегом (например, v0.1.0); пусто — просто сборка'
        required: false
        default: ''

permissions:
  contents: write

env:
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Ключ подписи — из секретов репозитория (KEYSTORE_BASE64 и пароли); пока их нет — ключ из репозитория.
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "секрета KEYSTORE_BASE64 нет — ключ из репозитория"
          elif echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore" 2>/dev/null \
              && keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storetype pkcs12 \
                   -storepass "${SIGNING_STORE_PASSWORD:-dirhamrub}" > /dev/null 2>&1; then
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
            echo "ключ — из секретов"
          else
            # Неверный секрет (не base64 или не тот пароль) не должен ронять сборку: подписываем прежним ключом.
            echo "::warning::KEYSTORE_BASE64 не открывается как ключ (нужно содержимое keystore/app.keystore в base64) — ключ из репозитория"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Tests, lint, build
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/dirhamrub-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/dirhamrub-release.apk

      # Квота хранилища артефактов общая на аккаунт; если она кончилась, сборка всё равно зелёная,
      # а APK для установки публикуется через GitHub Release по тегу.
      - uses: actions/upload-artifact@v5
        if: success()
        continue-on-error: true
        with:
          name: dirhamrub-apk
          path: out/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with:
          retention-days: 7
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # Релиз: по пушу тега v* или вручную (workflow_dispatch с release=vX.Y.Z) —
      # во втором случае gh сам создаёт тег на собранном коммите.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release || github.ref_name }}
        run: |
          cp out/dirhamrub-release.apk "out/dirhamrub-$TAG.apk"
          gh release create "$TAG" "out/dirhamrub-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Курс по чеку $TAG" \
            --notes "APK для Android 8.0+. Как установить — см. README." \
            || gh release upload "$TAG" "out/dirhamrub-$TAG.apk" --clobber

  # Открывает камеру release-сборки на эмуляторе и ловит падения (стек — в логе шага).
  smoke:
    name: camera-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      # Ключ подписи — из секретов репозитория (KEYSTORE_BASE64 и пароли); пока их нет — ключ из репозитория.
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "секрета KEYSTORE_BASE64 нет — ключ из репозитория"
          elif echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore" 2>/dev/null \
              && keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storetype pkcs12 \
                   -storepass "${SIGNING_STORE_PASSWORD:-dirhamrub}" > /dev/null 2>&1; then
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
            echo "ключ — из секретов"
          else
            # Неверный секрет (не base64 или не тот пароль) не должен ронять сборку: подписываем прежним ключом.
            echo "::warning::KEYSTORE_BASE64 не открывается как ключ (нужно содержимое keystore/app.keystore в base64) — ключ из репозитория"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Место на диске и KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/lib/android/sdk/ndk
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Release APK с x86_64
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease -Pdirhamrub.x86=true

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disk-size: 4096M
          disable-animations: true
          script: ./tools/smoke-camera.sh

  # Снимает ключевые экраны отладочной сборки с демо-данными (тёмная и светлая тема, крупный шрифт,
  # короткий экран, знакомство) и выкладывает их в пререлиз «screens»: квоты артефактов на это нет.
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !startsWith(github.event.inputs.release, 'v') }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      # Ключ подписи — из секретов репозитория (KEYSTORE_BASE64 и пароли); пока их нет — ключ из репозитория.
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "секрета KEYSTORE_BASE64 нет — ключ из репозитория"
          elif echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore" 2>/dev/null \
              && keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storetype pkcs12 \
                   -storepass "${SIGNING_STORE_PASSWORD:-dirhamrub}" > /dev/null 2>&1; then
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
            echo "ключ — из секретов"
          else
            # Неверный секрет (не base64 или не тот пароль) не должен ронять сборку: подписываем прежним ключом.
            echo "::warning::KEYSTORE_BASE64 не открывается как ключ (нужно содержимое keystore/app.keystore в base64) — ключ из репозитория"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Место на диске и KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug APK с x86_64
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug -Pdirhamrub.x86=true

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disk-size: 4096M
          disable-animations: true
          script: ./tools/screens.sh

      - name: Скриншоты в пререлиз «screens»
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screens/*.png > /dev/null 2>&1 || { echo "снимков нет"; exit 0; }
          echo "$GITHUB_SHA $GITHUB_REF_NAME" > screens/commit.txt
          gh release view screens > /dev/null 2>&1 || gh release create screens --prerelease --target "$GITHUB_SHA" \
            --title "Скриншоты CI" --notes "Снимки экранов последней сборки, обновляются автоматически."
          gh release upload screens screens/* --clobber
          gh release edit screens --notes "Снимки экранов сборки ${GITHUB_SHA::7} (${GITHUB_REF_NAME}), обновляются автоматически."
