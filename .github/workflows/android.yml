name: Android

on:
  push:
    branches: ['**', '!profiles/**']
    tags: ['v*']
    paths-ignore: ['.github/workflows/actions-storage.yml']
  pull_request:
    paths-ignore: ['.github/workflows/actions-storage.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Создать GitHub Release с этим тегом (например, v0.1.0); пусто — просто сборка'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

env:
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      screens: ${{ steps.scope.outputs.screens }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Только изменённые разрешённые экраны
        id: scope
        env:
          SCOPE_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          SCOPE_HEAD: ${{ github.sha }}
        run: |
          python3 tools/ui-scope.py --self-test
          python3 tools/ui-scope.py

  build:
    needs: ui-scope
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Ключ подписи — из секретов репозитория (KEYSTORE_BASE64 и пароли SIGNING_*); без них — отладочный ключ.
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::секрета KEYSTORE_BASE64 нет — отладочный ключ (выпуск невозможен)"
          elif echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore" 2>/dev/null \
              && keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storetype pkcs12 \
                   -storepass "$SIGNING_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
            echo "ключ — из секретов"
          else
            # Неверный секрет (не base64 или не тот пароль) не ломает проверку: отладочный ключ, но выпуск — нет.
            echo "::warning::KEYSTORE_BASE64 не открывается как ключ (нужен ключ подписи в base64) — отладочный ключ (выпуск невозможен)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Tests, lint, build
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Подготовить APK для Releases
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/dirhamrub-release.apk

      # APK храним только в Releases. Последний архив диагностики также не занимает квоту artifacts.
      - name: Отчёты сбоя в пререлиз ci-reports
        if: failure() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_paths=()
          for path in app/build/reports app/build/test-results; do
            if [ -d "$path" ]; then report_paths+=("$path"); fi
          done
          if [ "${#report_paths[@]}" -eq 0 ]; then
            echo "Отчёты ещё не созданы; причина сбоя — в журнале Actions"
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/ci-reports.tar.gz" "${report_paths[@]}"
          printf 'Commit: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-reports-source.txt"
          gh release view ci-reports > /dev/null 2>&1 || gh release create ci-reports --prerelease --target "$GITHUB_SHA" \
            --title "Диагностика CI" --notes "Отчёты последней неуспешной сборки Android."
          gh release upload ci-reports "$RUNNER_TEMP/ci-reports.tar.gz" "$RUNNER_TEMP/ci-reports-source.txt" --clobber
          gh release edit ci-reports --notes "Отчёты сбоя сборки ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Результат проверки экранов
        if: ${{ needs.ui-scope.outputs.screens == 'true' && !contains(github.event.head_commit.message, '[phone-check]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            screens_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "screens") | .conclusion // "pending"')
            case "$screens_state" in
              success) echo "Снимки и сценарии прошли"; exit 0 ;;
              failure|cancelled|timed_out|skipped|action_required|neutral)
                echo "::error::проверка экранов завершилась: $screens_state"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::проверка экранов не завершилась вовремя"
          exit 1

      # Снимки должен проверить агент до публикации, а не только после зелёного UI-сценария.
      # Лёгкий тег ui-reviewed-<SHA> ставится на этот же коммит после просмотра PNG и записи перехода.
      - name: Визуальная проверка текущего коммита
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release, 'v')) && needs.ui-scope.outputs.screens == 'true' && !contains(github.event.head_commit.message, '[phone-check]')
        run: |
          for attempt in $(seq 1 120); do
            REVIEWED=$(git ls-remote origin "refs/tags/ui-reviewed-$GITHUB_SHA" | awk '{print $1}')
            if [ "$REVIEWED" = "$GITHUB_SHA" ]; then
              echo "Снимки текущего коммита проверены"
              exit 0
            fi
            sleep 5
          done
          echo "::error::нет отметки визуальной проверки текущего коммита — выпуск остановлен"
          exit 1

      # Push в main автоматически выпускает новую versionName после всех проверок.
      # Теги и ручной workflow_dispatch также поддерживаются.
      - name: GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          if [ -z "$TAG" ]; then
            VERSION=$(sed -n 's/.*versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts)
            [ -n "$VERSION" ] || { echo "::error::versionName не найдена"; exit 1; }
            TAG="v$VERSION"
            # Повторная сборка той же версии не заменяет уже выпущенный APK.
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Релиз $TAG уже существует"
              exit 0
            fi
          fi
          # Выпуск — только с ключом из секретов: APK с отладочным ключом поверх установленного не встанет.
          if [ -z "${SIGNING_KEYSTORE_FILE:-}" ]; then
            echo "::error::нет ключа подписи из секретов (KEYSTORE_BASE64, SIGNING_*) — выпуск отменён"
            exit 1
          fi
          cp out/dirhamrub-release.apk "out/dirhamrub-$TAG.apk"
          gh release create "$TAG" "out/dirhamrub-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Курс по чеку $TAG" \
            --notes "APK для Android 8.0+. Как установить — см. README."

  # Перед выпуском — снимки только изменённых экранов. Информация о стране исключена.
  screens:
    needs: ui-scope
    # Только по прямому запросу владельца: APK проверяется на его телефоне.
    if: ${{ needs.ui-scope.outputs.screens == 'true' && !contains(github.event.head_commit.message, '[phone-check]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      # Ключ подписи — из секретов репозитория (KEYSTORE_BASE64 и пароли SIGNING_*); без них — отладочный ключ.
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::секрета KEYSTORE_BASE64 нет — отладочный ключ (выпуск невозможен)"
          elif echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore" 2>/dev/null \
              && keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storetype pkcs12 \
                   -storepass "$SIGNING_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
            echo "ключ — из секретов"
          else
            # Неверный секрет (не base64 или не тот пароль) не ломает проверку: отладочный ключ, но выпуск — нет.
            echo "::warning::KEYSTORE_BASE64 не открывается как ключ (нужен ключ подписи в base64) — отладочный ключ (выпуск невозможен)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Место на диске и KVM
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug APK с x86_64
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug -Pdirhamrub.x86=true

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back emulated
          disk-size: 4096M
          disable-animations: true
          script: ./tools/screens.sh

      - name: Диагностика сбоя эмулятора
        if: failure()
        run: |
          mkdir -p screens
          {
            date -u
            df -h "$RUNNER_TEMP"
            timeout 15s adb devices || true
            timeout 15s adb shell getprop sys.boot_completed || true
            timeout 15s adb logcat -d -b crash || true
          } > screens/emulator-health.txt 2>&1

      - name: Скриншоты в пререлиз «screens»
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p screens
          echo "$GITHUB_SHA $GITHUB_REF_NAME" > screens/commit.txt
          gh release view screens > /dev/null 2>&1 || gh release create screens --prerelease --target "$GITHUB_SHA" \
            --title "Скриншоты CI" --notes "Снимки экранов последней сборки, обновляются автоматически."
          # Пустой crash.txt нельзя загружать как release asset: GitHub отклоняет файлы нулевого размера.
          # PNG уже проверены; метку коммита отправляем отдельно от диагностических журналов.
          if ls screens/*.png > /dev/null 2>&1; then
            gh release upload screens screens/*.png --clobber
          fi
          for video in screens/*.mp4; do
            if [ -s "$video" ]; then
              gh release upload screens "$video" --clobber
            fi
          done
          gh release upload screens screens/commit.txt --clobber
          if [ -s screens/crash.txt ]; then
            gh release upload screens screens/crash.txt --clobber
          fi
          for report in screens/transition-error.txt screens/transition-ui.xml screens/font130-ui.xml screens/idle-frame-stats.txt screens/scenario.log screens/emulator-health.txt; do
            if [ -s "$report" ]; then
              gh release upload screens "$report" --clobber
            fi
          done
          gh release edit screens --notes "Снимки экранов сборки ${GITHUB_SHA::7} (${GITHUB_REF_NAME}), обновляются автоматически."
