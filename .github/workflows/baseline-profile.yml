name: Baseline Profile

on:
  push:
    branches: ['profiles/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests, lint and generator APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :baselineprofile:assembleNonMinifiedRelease -Pdirhamrub.x86=true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim
          disk-size: 4096M
          disable-animations: false
          script: ./gradlew :app:generateReleaseBaselineProfile -Pdirhamrub.x86=true --stacktrace
      - name: Check generated app rules
        run: python3 tools/export-baseline-profile.py
      - name: Reports
        if: always()
        run: |
          mkdir -p baseline-out
          printf '%s\n' "$GITHUB_SHA" > baseline-out/source.txt
          paths=()
          for path in baselineprofile/build/reports/androidTests baselineprofile/build/outputs/connected_android_test_additional_output; do
            if [ -d "$path" ]; then paths+=("$path"); fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then tar -czf baseline-out/reports.tar.gz "${paths[@]}"; fi
      - name: Profile files in Releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view baseline-profiles > /dev/null 2>&1 || gh release create baseline-profiles --prerelease --target "$GITHUB_SHA" --title "Baseline Profile" --notes "Generated ART profiles and diagnostics."
          gh release upload baseline-profiles baseline-out/* --clobber
          gh release edit baseline-profiles --notes "Source $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
