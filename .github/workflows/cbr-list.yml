name: Перечень валют ЦБ

# Раз в неделю сверяет перечень валют ЦБ РФ с пометкой «курс ЦБ» в приложении (tools/cbr-check.py):
# ЦБ добавил или убрал валюту — проверка красная, в логе что поправить.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Сверка с ответом ЦБ
        run: python3 -I tools/cbr-check.py
